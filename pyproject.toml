[project]
name = "predictive-maintenance-eda"
version = "0.1.0"
description = "EDA pipeline for AI4I 2020 Predictive Maintenance dataset"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "plotly>=5.20",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "pandera>=0.18",
    "loguru>=0.7",
    "jupyterlab>=4.1",
    "ipywidgets>=8.1",
    "setuptools<70",
    "fg-data-profiling>=4.19.1",
    "kaleido==0.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
